[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-ai-agent"
version = "0.1.0"
description = "Multilingual Multi-Agent Hospital Receptionist AI System with Google ADK, Gemini, and LiveKit"
authors = [{ name = "Senior AI Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.11.0",
    "google-genai>=2.30.1",
    "livekit-agents>=1.8.8",
    "livekit-plugins-google>=1.8.8",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
